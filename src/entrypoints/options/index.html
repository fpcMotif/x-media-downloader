<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open the rich full-page settings layout as a real browser tab, not the
         narrow embedded chrome://extensions dialog. WXT maps manifest.* meta
         tags onto the options entrypoint (open_in_tab → openInTab). -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>X Media Downloader — Settings</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        min-height: 100vh;
        background: #f8f9fb;
      }

      .xmd-boot-fallback {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #687386;
        font:
          14px/1.4 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
    </style>
  </head>
  <body class="xmd-options">
    <div id="app">
      <div class="xmd-boot-fallback">Loading settings…</div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
