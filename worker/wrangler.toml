name = "xmd-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# After running `wrangler d1 create xmd-jobs`, paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "xmd-jobs"
database_id = "YOUR_D1_DATABASE_ID"

# Uncomment to enable R2 media caching (optional speed boost).
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "xmd-media"
